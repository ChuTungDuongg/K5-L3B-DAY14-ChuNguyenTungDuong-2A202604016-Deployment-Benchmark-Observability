name: k5-day14-part6

services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-10}"
      DAILY_BUDGET_USD: "${DAILY_BUDGET_USD:-1.0}"
      MONTHLY_BUDGET_USD: "${MONTHLY_BUDGET_USD:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
